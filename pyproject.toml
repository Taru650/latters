[project]
name = "latters"
version = "0.1.0"
description = "Offline departmental letter drafting assistant"
requires-python = ">=3.10"
# numpy is the ONE runtime dependency, needed by the retrieval index. It was
# missing here until an end-to-end install test caught it: the "no corpus
# database" guard short-circuits before the import, so every quick check
# passed while `latters retrieve` against a real database would have failed
# with ModuleNotFoundError on a fresh machine.
#
# Everything else is standard library on purpose. Conversion, segmentation,
# classification, templating and drafting all work with numpy absent, which
# matters on a locked-down office machine with no wheelhouse.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# httpx2 is what starlette.testclient needs to drive the web app.
dev = ["pytest>=7", "httpx2"]
# Only for the optional dense-encoder path, which Phase 4 measured as not
# worth adopting. Install these only to re-run that decision yourself.
dense = ["onnxruntime>=1.16", "tokenizers>=0.15"]
# The drafting and admin pages. Server-rendered HTML and plain JavaScript --
# no Node toolchain, no bundle, and no CDN, because the office machine has
# no internet and only ~3 GB of RAM the model is not already using.
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]

[project.scripts]
latters = "latters.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latters = ["data/fonts/*.tsv", "data/gold/*.tsv",
           "web/templates/*.html", "web/static/*"]
